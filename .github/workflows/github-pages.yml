name: Build and publish GitHub Pages

on:
  push:
    branches: [codex/github-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies
        run: npm exec --yes --package=bun@1.3.3 -- bun install --frozen-lockfile
      - name: Test
        run: npm exec --yes --package=bun@1.3.3 -- bun run test
      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit
      - name: Build static site
        run: npm exec --yes --package=bun@1.3.3 -- bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    # Prepare/verify freely. Codex marks an approved release commit [publish-pages].
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[publish-pages]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
